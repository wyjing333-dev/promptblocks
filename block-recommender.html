<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积木推荐器 - PromptBlocks</title>
<style>
  :root {
    --bg-main: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-hover: #222240;
    --text-main: #e0e0e8;
    --text-muted: #8888a0;
    --border: #2a2a3e;
    --accent: #6366f1;
    --accent-pink: #ec4899;
    --good: #10b981;
    --warn: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
  }
  header {
    padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  .logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo span { font-size: 13px; color: var(--text-muted); font-weight: 400; -webkit-text-fill-color: var(--text-muted); }
  .back-link { margin-left: auto; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; text-decoration: none; cursor: pointer; transition: all 0.2s; }
  .back-link:hover { border-color: var(--accent); color: #a5b4fc; }
  .container { max-width: 900px; margin: 0 auto; padding: 24px; }
  .section { margin-bottom: 24px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .input-area { width: 100%; min-height: 100px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text-main); font-size: 14px; line-height: 1.6; resize: vertical; font-family: inherit; outline: none; transition: border-color 0.2s; }
  .input-area:focus { border-color: var(--accent); }
  .input-area::placeholder { color: var(--text-muted); }
  .btn-row { display: flex; gap: 12px; margin-top: 12px; }
  .btn { padding: 12px 28px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--bg-hover); color: var(--text-main); }
  .btn-secondary:hover { background: #2d2d4d; }
  .results { display: none; }
  .results.show { display: block; }
  .rec-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .rec-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.2s;
  }
  .rec-card:hover { border-color: var(--accent); }
  .rec-rank { font-size: 20px; font-weight: 800; color: var(--accent); min-width: 28px; text-align: center; }
  .rec-info { flex: 1; }
  .rec-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .rec-cat { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .rec-reason { font-size: 13px; color: #a5b4fc; }
  .rec-content { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; max-height: 60px; overflow: hidden; }
  .rec-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: rgba(99,102,241,0.1); color: #818cf8; }
  .rec-score { font-size: 13px; font-weight: 700; color: var(--good); min-width: 40px; text-align: right; }
  .prompt-output {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    max-height: 400px; overflow-y: auto; margin-bottom: 12px;
  }
  .copy-btn { padding: 10px 24px; border-radius: 10px; border: 1px solid var(--accent); background: transparent; color: #a5b4fc; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .copy-btn:hover { background: rgba(99,102,241,0.1); }
  .copy-btn.copied { background: var(--good); color: white; border-color: var(--good); }
  .empty-hint { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  .examples { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; }
  .examples-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .example-item { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
  .example-item:hover { border-color: var(--accent); color: var(--text-main); }
  @media (max-width: 768px) { .container { padding: 16px; } }
</style>
</head>
<body>

<header>
  <div class="logo">PromptBlocks <span>积木推荐器</span></div>
  <a class="back-link" href="index.html">← 返回积木库</a>
</header>

<div class="container">
  <div class="section">
    <div class="section-title">描述你的任务，AI 帮你选积木</div>
    <textarea class="input-area" id="taskInput" placeholder="用一句话描述你想让 AI 做什么...&#10;&#10;例如：帮我写一篇小红书种草文案，推荐一款气泡水，目标受众是年轻女性"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="recommend()">🧩 推荐积木组合</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="rec-grid" id="recGrid"></div>
    <div class="section-title">拼装结果</div>
    <div class="prompt-output" id="promptOutput"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">📋 复制 Prompt</button>
  </div>

  <div class="examples" id="examples">
    <div class="examples-title">不知道怎么描述？试试这些</div>
    <div class="example-item" onclick="loadExample(0)">帮我写一篇小红书种草文案，推荐一款气泡水，目标受众是年轻女性</div>
    <div class="example-item" onclick="loadExample(1)">分析一份合同的风险条款，用表格列出风险点和修改建议</div>
    <div class="example-item" onclick="loadExample(2)">给700个销售线索按意向度打分排序，帮我筛选高价值客户</div>
    <div class="example-item" onclick="loadExample(3)">写一段Python代码，实现REST API，要干净有注释</div>
    <div class="example-item" onclick="loadExample(4)">审查一段AI生成内容的质量，从准确性、完整性、简洁性打分</div>
  </div>
</div>

var EXAMPLES = [
  '帮我写一篇小红书种草文案，推荐一款气泡水，目标受众是年轻女性',
  '分析一份合同的风险条款，用表格列出风险点和修改建议',
  '给700个销售线索按意向度打分排序，帮我筛选高价值客户',
  '写一段Python代码，实现REST API，要干净有注释',
  '审查一段AI生成内容的质量，从准确性、完整性、简洁性打分',
];

function loadExample(idx) {
  document.getElementById('taskInput').value = EXAMPLES[idx];
  document.getElementById('results').classList.remove('show');
}

function clearAll() {
  document.getElementById('taskInput').value = '';
  document.getElementById('results').classList.remove('show');
}

function scoreBlock(block, input) {
  var score = 0;
  var reasons = [];
  var inputLower = input.toLowerCase();

  // Check tag matches
  block.tags.forEach(function(tag) {
    if (input.indexOf(tag) !== -1 || inputLower.indexOf(tag.toLowerCase()) !== -1) {
      score += 15;
      reasons.push('关键词匹配: ' + tag);
    }
  });

  // Check title matches
  var titleChars = block.title.split('');
  var titleMatchCount = 0;
  titleChars.forEach(function(ch) {
    if (ch.length > 1 && input.indexOf(ch) !== -1) titleMatchCount++;
  });
  if (titleMatchCount > 0) {
    score += titleMatchCount * 8;
    if (titleMatchCount >= 2) reasons.push('标题相关');
  }

  // Category priority: always try to have one role + one task
  if (block.cat === '角色' && score > 0) score += 5;
  if (block.cat === '任务' && score > 0) score += 5;

  // Special: if no role matched but task matched, give a default role a small score
  if (block.cat === '角色' && score === 0 && /写|做|帮我|请|分析|总结/.test(input)) {
    score += 3;
  }

  return { score: score, reasons: reasons };
}

function recommend() {
  var input = document.getElementById('taskInput').value.trim();
  if (!input) { alert('请先描述你的任务'); return; }

  // Score all blocks
  var scored = BLOCKS.map(function(b) {
    var result = scoreBlock(b, input);
    return { block: b, score: result.score, reasons: result.reasons };
  }).filter(function(s) { return s.score > 0; });

  // Sort by score descending
  scored.sort(function(a, b) { return b.score - a.score; });

  // Ensure category diversity: pick top from each category, then fill
  var selected = [];
  var usedCats = {};
  var usedIds = {};

  // First pass: top block per category
  scored.forEach(function(s) {
    if (!usedCats[s.block.cat] && selected.length < 6) {
      selected.push(s);
      usedCats[s.block.cat] = true;
      usedIds[s.block.id] = true;
    }
  });

  // Second pass: fill remaining slots
  scored.forEach(function(s) {
    if (!usedIds[s.block.id] && selected.length < 6) {
      selected.push(s);
      usedIds[s.block.id] = true;
    }
  });

  // If we still don't have 6, add default blocks
  if (selected.length < 3) {
    // Add a default role + task + format
    var defaults = [
      BLOCKS.find(function(b) { return b.id === 'role-marketer'; }),
      BLOCKS.find(function(b) { return b.id === 'task-write-article'; }),
      BLOCKS.find(function(b) { return b.id === 'fmt-markdown'; }),
      BLOCKS.find(function(b) { return b.id === 'con-step-by-step'; }),
    ];
    defaults.forEach(function(b) {
      if (b && !usedIds[b.id] && selected.length < 6) {
        selected.push({ block: b, score: 0, reasons: ['默认推荐'] });
        usedIds[b.id] = true;
      }
    });
  }

  // Render
  var grid = document.getElementById('recGrid');
  grid.innerHTML = selected.map(function(s, i) {
    var b = s.block;
    var reasonText = s.reasons.length > 0 ? s.reasons.join('、') : '综合匹配';
    var tags = b.tags.slice(0, 4).map(function(t) { return '<span class="rec-tag">' + t + '</span>'; }).join('');
    return '<div class="rec-card">' +
      '<div class="rec-rank">' + (i+1) + '</div>' +
      '<div class="rec-info">' +
      '<div class="rec-title">' + b.title + '</div>' +
      '<div class="rec-cat">' + b.cat + '</div>' +
      '<div class="rec-reason">匹配理由：' + reasonText + '</div>' +
      '<div class="rec-content">' + (b.content || '（无固定内容）') + '</div>' +
      '<div class="rec-tags">' + tags + '</div>' +
      '</div>' +
      '<div class="rec-score">' + s.score + '分</div>' +
      '</div>';
  }).join('');

  // Assemble prompt
  var promptParts = selected.filter(function(s) { return s.block.content; }).map(function(s) { return s.block.content; });
  var promptText = promptParts.join('\n\n');
  document.getElementById('promptOutput').textContent = promptText;

  document.getElementById('results').classList.add('show');
}

function copyPrompt() {
  var text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '📋 复制 Prompt'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
