<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptBlocks - 像搭积木一样拼Prompt</title>
<style>
  :root {
    --color-role: #6366f1;
    --color-task: #ec4899;
    --color-context: #10b981;
    --color-constraints: #f59e0b;
    --color-format: #8b5cf6;
    --color-examples: #06b6d4;
    --color-industry: #f97316;
    --bg-main: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-hover: #222240;
    --text-main: #e0e0e8;
    --text-muted: #8888a0;
    --border: #2a2a3e;
    --warn: #ef4444;
    --warn-bg: rgba(239,68,68,0.1);
    --info: #3b82f6;
    --info-bg: rgba(59,130,246,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo span { font-size: 13px; color: var(--text-muted); font-weight: 400; -webkit-text-fill-color: var(--text-muted); }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .preset-btn:hover { border-color: #6366f1; color: #a5b4fc; background: rgba(99,102,241,0.1); }
  .submit-btn {
    padding: 6px 16px; border-radius: 20px; border: 1px solid #10b981;
    background: rgba(16,185,129,0.1); color: #10b981; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .submit-btn:hover { background: rgba(16,185,129,0.2); }
  .tool-link {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 13px;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .tool-link:hover { border-color: #8b5cf6; color: #c4b5fd; }
  /* Mode Toggle */
  .mode-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .mode-btn {
    padding: 6px 16px; border: none; background: transparent; color: var(--text-muted);
    font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .mode-btn.active { background: rgba(99,102,241,0.15); color: #a5b4fc; font-weight: 600; }
  /* Platform Filter Bar */
  .platform-bar {
    padding: 10px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .platform-bar .plabel { font-size: 12px; color: var(--text-muted); margin-right: 4px; white-space: nowrap; }
  .platform-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .platform-btn {
    padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 12px;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .platform-btn:hover { border-color: #6366f1; color: #a5b4fc; }
  .platform-btn.active { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; font-weight: 600; }
  /* Data Dashboard */
  .dashboard {
    padding: 10px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
  }
  .stat-item { display: flex; flex-direction: column; gap: 1px; }
  .stat-item .stat-value {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2;
  }
  .stat-item .stat-label { font-size: 11px; color: var(--text-muted); }
  .stat-divider { width: 1px; height: 28px; background: var(--border); }
  .stat-link { font-size: 11px; color: var(--text-muted); text-decoration: none; }
  .stat-link:hover { color: #a5b4fc; }
  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 14px 16px; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
    background: var(--bg-card);
  }
  .panel-header .count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .block-library { width: 280px; border-right: 1px solid var(--border); }
  .category-tabs { display: flex; flex-direction: column; }
  .category-tab {
    padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-size: 14px; transition: all 0.2s;
  }
  .category-tab:hover { background: var(--bg-hover); }
  .category-tab.active { background: var(--bg-hover); border-left: 3px solid; }
  .category-tab .icon { font-size: 18px; }
  .category-tab .name { flex: 1; }
  .category-tab .num { font-size: 12px; color: var(--text-muted); }
  .blocks-list { flex: 1; overflow-y: auto; padding: 8px; }
  .block-item {
    padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 6px; cursor: pointer; transition: all 0.2s; background: var(--bg-card);
  }
  .block-item:hover { border-color: var(--accent, #6366f1); transform: translateY(-1px); }
  .block-item .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .block-item .desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .block-item .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .block-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .block-item .platforms { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .block-item .platform-tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .block-item .verify-info { font-size: 9px; color: #4a4a5e; margin-top: 4px; }
  /* Center - Assembly / Quick Input */
  .assembly { flex: 1; min-width: 320px; }
  .assembly-area { flex: 1; overflow-y: auto; padding: 16px; }
  .assembly-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-muted); gap: 12px;
  }
  .assembly-empty .icon { font-size: 48px; opacity: 0.3; }
  .assembly-empty .text { font-size: 15px; }
  .assembly-empty .hint { font-size: 13px; opacity: 0.6; }
  .assembled-block {
    padding: 14px 16px; border-radius: 10px; margin-bottom: 10px;
    border-left: 4px solid var(--accent, #6366f1); background: var(--bg-card);
    display: flex; align-items: flex-start; gap: 12px; cursor: move;
  }
  .assembled-block.conflict { border-left-color: var(--warn) !important; background: var(--warn-bg); }
  .assembled-block:hover .remove-btn { opacity: 1; }
  .assembled-block .order {
    width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: white;
  }
  .assembled-block .body { flex: 1; }
  .assembled-block .label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .assembled-block .content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .assembled-block .conflict-tag {
    display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 4px;
    background: var(--warn-bg); color: var(--warn); font-size: 11px; font-weight: 600;
  }
  .assembled-block .move-btn, .assembled-block .remove-btn {
    width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-muted); cursor: pointer; font-size: 12px; opacity: 0.4;
    transition: opacity 0.2s; flex-shrink: 0;
  }
  .assembled-block:hover .move-btn { opacity: 0.7; }
  .assembled-block .move-btn:hover { color: var(--text-main); opacity: 1; }
  .assembled-block .move-btn.disabled { opacity: 0.15; cursor: default; }
  .assembled-block .remove-btn { font-size: 16px; opacity: 0; }
  .assembled-block .remove-btn:hover { color: #ef4444; }
  /* Conflict Warning Banner */
  .conflict-banner {
    padding: 10px 14px; background: var(--warn-bg); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: #fca5a5; line-height: 1.4;
  }
  .redundancy-banner {
    padding: 10px 14px; background: var(--info-bg); border: 1px solid rgba(59,130,246,0.3);
    border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: #93c5fd; line-height: 1.4;
  }
  /* Quick Input Mode */
  .quick-input-area {
    width: 100%; min-height: 300px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; color: var(--text-main); font-size: 14px; line-height: 1.6;
    resize: vertical; font-family: inherit; outline: none; transition: border-color 0.2s;
  }
  .quick-input-area:focus { border-color: var(--color-role); }
  .quick-input-area::placeholder { color: var(--text-muted); }
  .quick-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .quick-score-mini {
    margin-top: 12px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; font-size: 13px; color: var(--text-muted);
  }
  .quick-score-mini .qscore-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
  .quick-score-mini .qscore-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  /* Right - Output */
  .output-panel { width: 380px; border-left: 1px solid var(--border); }
  .output-area { flex: 1; overflow-y: auto; padding: 16px; }
  .prompt-preview {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    word-break: break-word; min-height: 200px;
  }
  .prompt-preview.empty { color: var(--text-muted); font-style: italic; }
  .output-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn {
    padding: 10px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; flex: 1; justify-content: center; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--bg-hover); color: var(--text-main); }
  .btn-secondary:hover { background: #2d2d4d; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    padding: 12px 24px; background: #10b981; color: white; border-radius: 8px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 100; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .sponsors {
    padding: 14px 24px; background: var(--bg-card); border-top: 1px solid var(--border); text-align: center;
  }
  .sponsors .sponsor-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px; }
  .sponsors .sponsor-content { font-size: 13px; color: var(--text-muted); }
  .sponsors .sponsor-content a { color: #6366f1; text-decoration: none; }
  .sponsors .sponsor-content a:hover { text-decoration: underline; }
  @media (max-width: 1024px) {
    .main { flex-direction: column; }
    .block-library { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 350px; }
    .block-library .category-tabs { flex-direction: row; flex-wrap: wrap; }
    .block-library .category-tab { border-bottom: none; border-right: 1px solid var(--border); border-left: 3px solid transparent; }
    .block-library .category-tab.active { border-bottom: 2px solid var(--accent); border-left: 3px solid var(--accent); }
    .output-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    .dashboard { gap: 16px; }
  }
</style>
</head>

// ===== State =====
var activeCategory = 'role';
var activePlatform = 'all';
var assembled = [];
var currentMode = 'assembly'; // 'assembly' or 'quick'
var quickText = '';

// ===== Init =====
function init() {
  renderDashboard();
  renderPlatformFilters();
  renderCategoryTabs();
  renderBlocks();
  renderPresets();
  renderCenterPanel();
}

function renderPresets() {
  var el = document.getElementById('presets');
  el.innerHTML = PRESETS.map(function(p) {
    return '<button class="preset-btn" onclick="loadPreset(\'' + p.id + '\')">' + p.name + '</button>';
  }).join('');
}

function renderDashboard() {
  var totalBlocks = 0;
  CATEGORIES.forEach(function(c) { totalBlocks += c.blocks.length; });
  var el = document.getElementById('dashboard');
  el.innerHTML =
    '<div class="stat-item"><div class="stat-value">' + totalBlocks + '</div><div class="stat-label">积木总数</div></div>' +
    '<div class="stat-divider"></div>' +
    '<div class="stat-item"><div class="stat-value">' + CATEGORIES.length + '</div><div class="stat-label">分类</div></div>' +
    '<div class="stat-divider"></div>' +
    '<div class="stat-item"><div class="stat-value">' + (PLATFORMS.length - 1) + '</div><div class="stat-label">适配平台</div></div>' +
    '<div class="stat-divider"></div>' +
    '<div class="stat-item"><div class="stat-value">' + PRESETS.length + '</div><div class="stat-label">预设模板</div></div>' +
    '<div class="stat-divider"></div>' +
    '<div class="stat-item"><div class="stat-value" style="font-size:14px">开源</div><div class="stat-label"><a class="stat-link" href="https://github.com/wyjing333-dev/promptblocks" target="_blank">GitHub 项目</a></div></div>';
}

function renderPlatformFilters() {
  var el = document.getElementById('platformFilters');
  el.innerHTML = PLATFORMS.map(function(p) {
    return '<button class="platform-btn' + (p.id === activePlatform ? ' active' : '') + '" onclick="setPlatform(\'' + p.id + '\')">' + p.icon + ' ' + p.name + '</button>';
  }).join('');
}

function setPlatform(pid) {
  activePlatform = pid;
  renderPlatformFilters();
  renderCategoryTabs();
  renderBlocks();
}

function renderCategoryTabs() {
  var el = document.getElementById('categoryTabs');
  el.innerHTML = CATEGORIES.map(function(c) {
    var count = activePlatform === 'all'
      ? c.blocks.length
      : c.blocks.filter(function(b) { return b.platforms.indexOf('all') !== -1 || b.platforms.indexOf(activePlatform) !== -1; }).length;
    return '<div class="category-tab' + (c.id === activeCategory ? ' active' : '') + '" style="' + (c.id === activeCategory ? 'border-left-color:' + c.color : '') + '" onclick="switchCategory(\'' + c.id + '\')">' +
      '<span class="icon">' + c.icon + '</span><span class="name">' + c.name + '</span><span class="num">' + count + '</span></div>';
  }).join('');
}

function switchCategory(catId) {
  activeCategory = catId;
  renderCategoryTabs();
  renderBlocks();
}

function renderPlatformTags(platforms) {
  if (!platforms || platforms.indexOf('all') !== -1) {
    return '<span class="platform-tag" style="background:rgba(99,102,241,0.15);color:#a5b4fc;">🌐 全平台</span>';
  }
  return platforms.map(function(pid) {
    var p = PLATFORMS.find(function(x) { return x.id === pid; });
    if (!p) return '';
    return '<span class="platform-tag" style="background:' + p.bg + ';color:' + p.color + ';">' + p.icon + ' ' + p.name + '</span>';
  }).join('');
}

function renderBlocks() {
  var cat = CATEGORIES.find(function(c) { return c.id === activeCategory; });
  var el = document.getElementById('blocksList');
  if (!cat) return;
  var filtered = activePlatform === 'all'
    ? cat.blocks
    : cat.blocks.filter(function(b) { return b.platforms.indexOf('all') !== -1 || b.platforms.indexOf(activePlatform) !== -1; });
  if (filtered.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">该平台暂无适配积木</div>';
    return;
  }
  el.innerHTML = filtered.map(function(b) {
    return '<div class="block-item" style="--accent:' + cat.color + '" onclick="addBlock(\'' + cat.id + '\',\'' + b.id + '\')">' +
      '<div class="title">' + b.title + '</div>' +
      '<div class="desc">' + (b.content || '(无内容)') + '</div>' +
      '<div class="tags">' + b.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
      '<div class="platforms">' + renderPlatformTags(b.platforms) + '</div>' +
      '<div class="verify-info">✓ ' + b.verified + ' · ' + b.model + '</div>' +
      '</div>';
  }).join('');
}

function findBlock(blockId) {
  for (var i = 0; i < CATEGORIES.length; i++) {
    var b = CATEGORIES[i].blocks.find(function(x) { return x.id === blockId; });
    if (b) return { block: b, category: CATEGORIES[i] };
  }
  return null;
}

// ===== Mode Toggle =====
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeAssembly').classList.toggle('active', mode === 'assembly');
  document.getElementById('modeQuick').classList.toggle('active', mode === 'quick');
  renderCenterPanel();
  renderPrompt();
}

    areaEl.innerHTML =
      '<textarea class="quick-input-area" id="quickInput" placeholder="直接输入你的 Prompt...&#10;&#10;简单提问直接打字即可，无需拼装积木。&#10;点击左侧积木可追加到末尾。&#10;&#10;例如：请帮我写一封求职信，应聘互联网产品经理岗位，突出我的数据分析能力和用户洞察力。" oninput="onQuickInput()">' + escapeHtml(quickText) + '</textarea>' +
      '<div class="quick-hint">💡 简单提问直接打字即可。需要结构化 Prompt 时，点左侧积木追加。</div>' +
      '<div class="quick-score-mini" id="quickScoreMini" style="display:none;"></div>';
    var qi = document.getElementById('quickInput');
    if (qi) { qi.focus(); updateQuickScore(); }
  } else {
    titleEl.textContent = '拼装区';
    countEl.textContent = assembled.length + ' 个积木';
    renderAssembly();
  }
}

function onQuickInput() {
  var qi = document.getElementById('quickInput');
  if (!qi) return;
  quickText = qi.value;
  document.getElementById('assemblyCount').textContent = quickText.length + ' 字';
  updateQuickScore();
  renderPrompt();
}

function updateQuickScore() {
  var el = document.getElementById('quickScoreMini');
  if (!el) return;
  if (!quickText.trim()) { el.style.display = 'none'; return; }
  var score = quickScorePrompt(quickText);
  var color = score >= 70 ? '#10b981' : score >= 50 ? '#f59e0b' : '#ef4444';
  el.style.display = 'block';
  el.innerHTML = '实时评分：<strong style="color:' + color + '">' + score + '</strong>/100' +
    '<div class="qscore-bar"><div class="qscore-fill" style="width:' + score + '%;background:' + color + ';"></div></div>';
  if (score < 70) {
    el.innerHTML += '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);">建议补充角色定义、输出格式、字数约束等要素。可点击左侧积木快速追加。</div>';
  }
}

function quickScorePrompt(text) {
  var score = 0;
  if (/你是一|你是|作为一名/.test(text)) score += 25;
  if (/请写|请分析|请总结|请翻译|请生成|请创建|请设计|请制定|请编写|写一|分析一下/.test(text)) score += 25;
  if (/格式|Markdown|JSON|表格|列表|字数|字以内|控制在/.test(text)) score += 20;
  if (/不要|避免|必须|确保|要求|风格|语气/.test(text)) score += 15;
  if (/目标受众|用户|背景|场景|平台|以下/.test(text)) score += 15;
  return Math.min(score, 100);
}

// ===== Conflict Detection =====
function checkConflicts() {
  var conflicts = [];
  var ids = assembled.map(function(a) { return a.blockId; });
  // Check pairs
  CONFLICT_PAIRS.forEach(function(cp) {
    if (ids.indexOf(cp.a) !== -1 && ids.indexOf(cp.b) !== -1) {
      conflicts.push({ a: cp.a, b: cp.b, reason: cp.reason });
    }
  });
  // Check solo categories (only one block per category)
  SOLO_CATEGORIES.forEach(function(catId) {
    var catBlocks = assembled.filter(function(a) { return a.categoryId === catId; });
    if (catBlocks.length > 1) {
      conflicts.push({
        a: catBlocks[0].blockId, b: catBlocks[1].blockId,
        reason: catId === 'format' ? '格式冲突：建议只选一种输出格式' : '示例冲突：建议只选一种示例'
      });
    }
  });
  return conflicts;
}

function getConflictForBlock(blockId) {
  var conflicts = checkConflicts();
  for (var i = 0; i < conflicts.length; i++) {
    if (conflicts[i].a === blockId || conflicts[i].b === blockId) return conflicts[i];
  }
  return null;
}

// ===== Block Add / Remove =====
function addBlock(catId, blockId) {
  var cat = CATEGORIES.find(function(c) { return c.id === catId; });
  if (!cat) return;
  var block = cat.blocks.find(function(b) { return b.id === blockId; });
  if (!block) return;
  if (currentMode === 'quick') {
    // Append block content to quick input
    var content = block.content || '';
    if (content) {
      quickText = quickText ? quickText + '\n\n' + content : content;
      var qi = document.getElementById('quickInput');
      if (qi) qi.value = quickText;
      document.getElementById('assemblyCount').textContent = quickText.length + ' 字';
      updateQuickScore();
      renderPrompt();
    }
    return;
  }
  assembled.push({ blockId: blockId, categoryId: catId, block: block });
  renderAssembly();
  renderPrompt();
}

function removeBlock(index) {
  assembled.splice(index, 1);
  renderAssembly();
  renderPrompt();
}

function moveBlock(index, dir) {
  var ni = index + dir;
  if (ni < 0 || ni >= assembled.length) return;
  var tmp = assembled[index]; assembled[index] = assembled[ni]; assembled[ni] = tmp;
  renderAssembly(); renderPrompt();
}

function clearAll() {
  if (currentMode === 'quick') {
    quickText = '';
    var qi = document.getElementById('quickInput');
    if (qi) qi.value = '';
    document.getElementById('assemblyCount').textContent = '0 字';
    updateQuickScore();
    renderPrompt();
  } else {
    assembled = [];
    renderAssembly();
    renderPrompt();
  }
}

function resetAll() {
  clearAll();
  document.getElementById('promptPreview').className = 'prompt-preview empty';
  document.getElementById('promptPreview').textContent = '从左侧选择积木，你的Prompt会在这里实时生成...';
  document.getElementById('copyBtn').disabled = true;
}

function loadPreset(presetId) {
  var preset = PRESETS.find(function(p) { return p.id === presetId; });
  if (!preset) return;
  if (currentMode === 'quick') {
    // Load preset as text into quick input
    var parts = [];
    for (var i = 0; i < preset.blocks.length; i++) {
      var found = findBlock(preset.blocks[i]);
      if (found && found.block.content) parts.push(found.block.content);
    }
    quickText = parts.join('\n\n');
    var qi = document.getElementById('quickInput');
    if (qi) qi.value = quickText;
    document.getElementById('assemblyCount').textContent = quickText.length + ' 字';
    updateQuickScore();
    renderPrompt();
  } else {
    assembled = [];
    for (var i = 0; i < preset.blocks.length; i++) {
      var found = findBlock(preset.blocks[i]);
      if (found) assembled.push({ blockId: preset.blocks[i], categoryId: found.category.id, block: found.block });
    }
    renderAssembly();
    renderPrompt();
  }
}

function renderAssembly() {
  var el = document.getElementById('assemblyArea');
  var countEl = document.getElementById('assemblyCount');
  if (currentMode === 'quick') { renderCenterPanel(); return; }
  countEl.textContent = assembled.length + ' 个积木';
  if (assembled.length === 0) {
    el.innerHTML = '<div class="assembly-empty"><div class="icon">🧱</div><div class="text">从左侧选择积木开始拼装</div><div class="hint">或点击顶部预设模板一键加载</div><div class="hint" style="margin-top:8px;color:#6366f1;">⚡ 简单提问？点右上角切换"快捷模式"直接打字</div></div>';
    return;
  }
  var conflicts = checkConflicts();
  var html = '';
  // Conflict banners
  if (conflicts.length > 0) {
    conflicts.forEach(function(c) {
      html += '<div class="conflict-banner">⚠️ ' + c.reason + '</div>';
    });
  }
  // Redundancy warning
  if (assembled.length > 6) {
    html += '<div class="redundancy-banner">💡 已选 ' + assembled.length + ' 个积木，积木过多可能导致提示词冗余、AI注意力分散。建议精简到4-6个核心积木。</div>';
  }
  // Assembled blocks
  assembled.forEach(function(item, i) {
    var cat = CATEGORIES.find(function(c) { return c.id === item.categoryId; });
    var color = cat ? cat.color : '#6366f1';
    var icon = cat ? cat.icon : '🔧';
    var conflict = getConflictForBlock(item.blockId);
    html += '<div class="assembled-block' + (conflict ? ' conflict' : '') + '" style="--accent:' + color + '">' +
      '<div class="order" style="background:' + color + '">' + (i + 1) + '</div>' +
      '<div class="body">' +
      '<div class="label">' + icon + ' ' + (cat ? cat.name : '') + ' - ' + item.block.title + '</div>' +
      '<div class="content">' + (item.block.content || '(无内容，仅作占位)') + '</div>' +
      (conflict ? '<div class="conflict-tag">⚠️ ' + conflict.reason + '</div>' : '') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:2px">' +
      '<button class="move-btn' + (i === 0 ? ' disabled' : '') + '" onclick="moveBlock(' + i + ',-1)" title="上移">▲</button>' +
      '<button class="move-btn' + (i === assembled.length - 1 ? ' disabled' : '') + '" onclick="moveBlock(' + i + ',1)" title="下移">▼</button>' +
      '<button class="remove-btn" onclick="removeBlock(' + i + ')" title="删除">✕</button>' +
      '</div></div>';
  });
  el.innerHTML = html;
}

function renderPrompt() {
  var el = document.getElementById('promptPreview');
  var copyBtn = document.getElementById('copyBtn');
  var text = '';
  if (currentMode === 'quick') {
    text = quickText.trim();
  } else {
    var parts = assembled.map(function(item) { return item.block.content; }).filter(function(c) { return c && c.trim(); });
    text = parts.join('\n\n');
  }
  if (!text) {
    el.className = 'prompt-preview empty';
    el.textContent = currentMode === 'quick' ? '在中间输入框打字，你的Prompt会在这里实时生成...' : '从左侧选择积木，你的Prompt会在这里实时生成...';
    copyBtn.disabled = true;
    return;
  }
  el.className = 'prompt-preview';
  el.textContent = text;
  copyBtn.disabled = false;
}

function copyPrompt() {
  var text = document.getElementById('promptPreview').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() {
    showToast('已复制到剪贴板！');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('已复制到剪贴板！'); } catch(e) { showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  });
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2000);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
