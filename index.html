<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptBlocks - 像搭积木一样拼Prompt</title>
<style>
  :root {
    --color-role: #6366f1;
    --color-task: #ec4899;
    --color-context: #10b981;
    --color-constraints: #f59e0b;
    --color-format: #8b5cf6;
    --color-examples: #06b6d4;
    --bg-main: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-hover: #222240;
    --text-main: #e0e0e8;
    --text-muted: #8888a0;
    --border: #2a2a3e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  header {
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo span { font-size: 13px; color: var(--text-muted); font-weight: 400; -webkit-text-fill-color: var(--text-muted); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover { border-color: #6366f1; color: #a5b4fc; background: rgba(99,102,241,0.1); }
  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
  }
  .panel-header .count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  /* Left - Block Library */
  .block-library { width: 280px; border-right: 1px solid var(--border); }
  .category-tabs { display: flex; flex-direction: column; }
  .category-tab {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .category-tab:hover { background: var(--bg-hover); }
  .category-tab.active { background: var(--bg-hover); border-left: 3px solid; }
  .category-tab .icon { font-size: 18px; }
  .category-tab .name { flex: 1; }
  .category-tab .num { font-size: 12px; color: var(--text-muted); }
  /* Blocks list */
  .blocks-list { flex: 1; overflow-y: auto; padding: 8px; }
  .block-item {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg-card);
  }
  .block-item:hover { border-color: var(--accent, #6366f1); transform: translateY(-1px); }
  .block-item .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .block-item .desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .block-item .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .block-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-muted); }
  /* Center - Assembly */
  .assembly { flex: 1; min-width: 320px; }
  .assembly-area { flex: 1; overflow-y: auto; padding: 16px; }
  .assembly-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
  }
  .assembly-empty .icon { font-size: 48px; opacity: 0.3; }
  .assembly-empty .text { font-size: 15px; }
  .assembly-empty .hint { font-size: 13px; opacity: 0.6; }
  .assembled-block {
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid var(--accent, #6366f1);
    background: var(--bg-card);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: move;
  }
  .assembled-block:hover .remove-btn { opacity: 1; }
  .assembled-block .order {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    color: white;
  }
  .assembled-block .body { flex: 1; }
  .assembled-block .label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .assembled-block .content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .assembled-block .move-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    opacity: 0.4;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .assembled-block:hover .move-btn { opacity: 0.7; }
  .assembled-block .move-btn:hover { color: var(--text-main); opacity: 1; }
  .assembled-block .move-btn.disabled { opacity: 0.15; cursor: default; }
  .assembled-block .remove-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .assembled-block .remove-btn:hover { color: #ef4444; }
  /* Right - Output */
  .output-panel { width: 380px; border-left: 1px solid var(--border); }
  .output-area { flex: 1; overflow-y: auto; padding: 16px; }
  .prompt-preview {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 200px;
  }
  .prompt-preview.empty { color: var(--text-muted); font-style: italic; }
  .output-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; flex: 1; justify-content: center; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--bg-hover); color: var(--text-main); }
  .btn-secondary:hover { background: #2d2d4d; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }
  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 12px 24px;
    background: #10b981;
    color: white;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  /* Responsive */
  @media (max-width: 1024px) {
    .main { flex-direction: column; }
    .block-library { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 350px; }
    .block-library .category-tabs { flex-direction: row; flex-wrap: wrap; }
    .block-library .category-tab { border-bottom: none; border-right: 1px solid var(--border); border-left: 3px solid transparent; }
    .block-library .category-tab.active { border-bottom: 2px solid var(--accent); border-left: 3px solid var(--accent); }
    .output-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">PromptBlocks <span>像搭积木一样拼Prompt</span></div>
  <div class="presets" id="presets"></div>
</header>

<div class="main">
  <!-- Left: Block Library -->
  <div class="panel block-library">
    <div class="panel-header">积木库</div>
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="blocks-list" id="blocksList"></div>
  </div>

  <!-- Center: Assembly Area -->
  <div class="panel assembly">
    <div class="panel-header">
      拼装区 <span class="count" id="assemblyCount">0 个积木</span>
      <span style="margin-left:auto">
        <button class="btn btn-secondary" style="padding:4px 12px;font-size:12px" onclick="clearAssembly()">清空</button>
      </span>
    </div>
    <div class="assembly-area" id="assemblyArea">
      <div class="assembly-empty">
        <div class="icon">🧱</div>
        <div class="text">从左侧选择积木开始拼装</div>
        <div class="hint">或点击顶部预设模板一键加载</div>
      </div>
    </div>
  </div>

  <!-- Right: Output -->
  <div class="panel output-panel">
    <div class="panel-header">生成的Prompt</div>
    <div class="output-area">
      <div class="prompt-preview empty" id="promptPreview">从左侧选择积木，你的Prompt会在这里实时生成...</div>
    </div>
    <div class="output-actions">
      <button class="btn btn-primary" id="copyBtn" onclick="copyPrompt()" disabled>
        <span>📋</span> 复制Prompt
      </button>
      <button class="btn btn-secondary" onclick="resetAll()" style="padding:10px 14px">重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制到剪贴板！</div>

<script>
// ===== Block Data =====
const CATEGORIES = [
  {
    id: 'role', name: '角色', icon: '🎭', color: '#6366f1',
    blocks: [
      { id: 'role-marketer', title: '营销专家', content: '你是一位有10年经验的数字营销专家，擅长小红书、抖音、公众号等平台的种草文案和增长策略。', tags: ['营销','文案','增长'] },
      { id: 'role-copywriter', title: '文案大师', content: '你是一位资深广告文案大师，曾服务多个一线品牌，擅长用情感化语言打动用户，写作风格简洁有力。', tags: ['文案','广告','品牌'] },
      { id: 'role-programmer', title: '程序员', content: '你是一位全栈工程师，精通Python、JavaScript、React，擅长写出干净、可维护、有注释的代码。', tags: ['编程','代码','全栈'] },
      { id: 'role-product-manager', title: '产品经理', content: '你是一位资深产品经理，擅长用户需求分析、竞品调研、产品规划和PRD撰写，思维逻辑严密。', tags: ['产品','需求','规划'] },
      { id: 'role-designer', title: '设计师', content: '你是一位UI/UX设计师，擅长用户界面设计、交互设计、设计系统搭建，注重用户体验和视觉美感。', tags: ['设计','UI','UX'] },
      { id: 'role-teacher', title: '教师', content: '你是一位耐心的教师，擅长用通俗易懂的语言解释复杂概念，喜欢用类比和案例辅助教学。', tags: ['教育','教学','科普'] },
      { id: 'role-consultant', title: '商业顾问', content: '你是一位商业战略顾问，擅长市场分析、商业模式设计、竞争策略制定，决策基于数据和逻辑。', tags: ['商业','战略','咨询'] },
      { id: 'role-writer', title: '作家', content: '你是一位畅销书作家，擅长叙事结构设计、人物塑造、情感表达，文字有画面感和感染力。', tags: ['写作','创意','叙事'] },
      { id: 'role-data-analyst', title: '数据分析师', content: '你是一位资深数据分析师，精通数据清洗、统计分析、数据可视化，擅长用数据讲故事，能从海量数据中提炼有商业价值的洞察。', tags: ['数据','分析','可视化'] },
    ]
  },
  {
    id: 'task', name: '任务', icon: '🎯', color: '#ec4899',
    blocks: [
      { id: 'task-write-article', title: '写文章', content: '请根据以下主题写一篇文章，要求内容有深度、结构清晰、有观点输出。', tags: ['写作','文章'] },
      { id: 'task-write-copy', title: '写文案', content: '请为以下产品/服务写一套营销文案，包含标题、卖点提炼、场景化描述和行动号召。', tags: ['文案','营销'] },
      { id: 'task-summarize', title: '总结提炼', content: '请总结以下内容的核心观点，提炼出3-5个关键要点，每个要点用一句话概括。', tags: ['总结','提炼'] },
      { id: 'task-translate', title: '翻译', content: '请将以下内容翻译成目标语言，保持原文的语气和风格，确保翻译自然流畅。', tags: ['翻译','多语言'] },
      { id: 'task-analyze', title: '分析', content: '请对以下内容进行深度分析，从多个维度展开，给出有数据支撑的结论和建议。', tags: ['分析','研究'] },
      { id: 'task-code', title: '写代码', content: '请根据以下需求编写代码，要求代码干净、有注释、可直接运行，并附上使用说明。', tags: ['编程','代码'] },
      { id: 'task-brainstorm', title: '头脑风暴', content: '请围绕以下主题进行头脑风暴，给出10个创意方向，每个方向附简短说明。', tags: ['创意','发散'] },
      { id: 'task-plan', title: '制定计划', content: '请根据以下目标制定一份详细的执行计划，包含时间线、关键里程碑和资源需求。', tags: ['计划','执行'] },
    ]
  },
  {
    id: 'context', name: '上下文', icon: '📋', color: '#10b981',
    blocks: [
      { id: 'ctx-audience-general', title: '大众受众', content: '目标受众是普通大众，年龄18-45岁，非专业背景，需要通俗易懂的内容。', tags: ['受众','大众'] },
      { id: 'ctx-audience-professional', title: '专业受众', content: '目标受众是该领域的专业人士，具备相关背景知识，可以接受专业术语和深度分析。', tags: ['受众','专业'] },
      { id: 'ctx-platform-xhs', title: '小红书平台', content: '内容将发布在小红书，受众为18-35岁女性用户，喜欢种草文风格，需要emoji和话题标签。', tags: ['小红书','种草'] },
      { id: 'ctx-platform-douyin', title: '抖音平台', content: '内容将用于抖音短视频脚本，时长控制在60秒内，需要开场hook、节奏紧凑、结尾互动引导。', tags: ['抖音','短视频'] },
      { id: 'ctx-platform-wechat', title: '公众号平台', content: '内容将发布在微信公众号，受众为25-40岁职场人群，偏好有深度、有观点的长文。', tags: ['公众号','长文'] },
      { id: 'ctx-business', title: '商业背景', content: '当前是一个创业团队，处于早期阶段，资源有限，需要快速验证和低成本试错。', tags: ['创业','商业'] },
      { id: 'ctx-education', title: '学习场景', content: '用户正在学习这个领域，是零基础新手，需要从最基础的概念开始，循序渐进。', tags: ['学习','新手'] },
    ]
  },
  {
    id: 'constraints', name: '约束', icon: '⚙️', color: '#f59e0b',
    blocks: [
      { id: 'con-short', title: '简洁要求', content: '输出控制在300字以内，直奔主题，不要铺垫和废话。', tags: ['简洁','字数'] },
      { id: 'con-long', title: '深度长文', content: '输出不少于1500字，内容需要有深度分析和案例支撑，结构完整。', tags: ['长文','深度'] },
      { id: 'con-style-professional', title: '专业风格', content: '使用正式、专业的语言风格，避免口语化表达，适当使用行业术语。', tags: ['风格','专业'] },
      { id: 'con-style-casual', title: '轻松风格', content: '使用轻松、活泼的语言风格，可以适当使用网络流行语和emoji，拉近距离。', tags: ['风格','轻松'] },
      { id: 'con-no-jargon', title: '禁止术语', content: '不要使用任何专业术语，用14岁孩子也能听懂的语言解释。', tags: ['约束','通俗'] },
      { id: 'con-step-by-step', title: '分步骤', content: '请分步骤回答，每个步骤编号并加粗标题，步骤之间用分隔线隔开。', tags: ['格式','步骤'] },
      { id: 'con-positive', title: '正面指令', content: '请直接告诉我要做什么，而不是告诉我不该做什么。', tags: ['约束','正面'] },
    ]
  },
  {
    id: 'format', name: '格式', icon: '📐', color: '#8b5cf6',
    blocks: [
      { id: 'fmt-markdown', title: 'Markdown格式', content: '请用Markdown格式输出，包含标题、要点列表和总结。', tags: ['格式','Markdown'] },
      { id: 'fmt-table', title: '表格格式', content: '请用表格形式呈现对比结果，表头清晰，数据对齐。', tags: ['格式','表格'] },
      { id: 'fmt-json', title: 'JSON格式', content: '请用JSON格式输出，字段名用英文，值用中文，确保JSON合法可解析。', tags: ['格式','JSON'] },
      { id: 'fmt-list', title: '列表格式', content: '请用编号列表格式输出，每条不超过两句话。', tags: ['格式','列表'] },
      { id: 'fmt-dialogue', title: '对话格式', content: '请用问答对话形式输出，模拟用户和专家的交流场景。', tags: ['格式','对话'] },
      { id: 'fmt-template', title: '模板格式', content: '请输出一个可直接复制使用的模板，用{占位符}标记需要替换的部分。', tags: ['格式','模板'] },
    ]
  },
  {
    id: 'examples', name: '示例', icon: '💡', color: '#06b6d4',
    blocks: [
      { id: 'ex-none', title: '不需要示例', content: '', tags: ['无示例'] },
      { id: 'ex-style', title: '风格示例', content: '参考以下风格：原句"天气很好" 改写为"阳光如同金色的液体倾洒而下"。现在请按此风格改写我的内容。', tags: ['示例','风格'] },
      { id: 'ex-structure', title: '结构示例', content: '请按以下结构输出：\n1. 核心观点（1句话）\n2. 详细分析（3-5句话）\n3. 行动建议（2-3条）', tags: ['示例','结构'] },
      { id: 'ex-tone', title: '语气示例', content: '请参考以下语气写作：示例"嘿，朋友们！今天分享一个超实用的技巧..." 保持这种亲切、对话式的语气。', tags: ['示例','语气'] },
    ]
  },
];

const PRESETS = [
  { id: 'preset-xhs', name: '小红书种草', blocks: ['role-marketer','task-write-copy','ctx-platform-xhs','con-style-casual','fmt-list','ex-tone'] },
  { id: 'preset-code', name: '代码评审', blocks: ['role-programmer','task-analyze','ctx-audience-professional','con-step-by-step','fmt-markdown','ex-none'] },
  { id: 'preset-video', name: '短视频脚本', blocks: ['role-marketer','task-write-article','ctx-platform-douyin','con-short','fmt-template','ex-structure'] },
  { id: 'preset-learn', name: '学习新知识', blocks: ['role-teacher','task-analyze','ctx-education','con-no-jargon','fmt-markdown','ex-structure'] },
];

// ===== State =====
let activeCategory = 'role';
let assembled = []; // [{blockId, categoryId, block}]

// ===== Init =====
function init() {
  renderCategoryTabs();
  renderBlocks();
  renderPresets();
}

function renderPresets() {
  const el = document.getElementById('presets');
  el.innerHTML = PRESETS.map(p => `<button class="preset-btn" onclick="loadPreset('${p.id}')">${p.name}</button>`).join('');
}

function renderCategoryTabs() {
  const el = document.getElementById('categoryTabs');
  el.innerHTML = CATEGORIES.map(c => `
    <div class="category-tab ${c.id === activeCategory ? 'active' : ''}" style="${c.id === activeCategory ? `border-left-color:${c.color}` : ''}" onclick="switchCategory('${c.id}')">
      <span class="icon">${c.icon}</span>
      <span class="name">${c.name}</span>
      <span class="num">${c.blocks.length}</span>
    </div>
  `).join('');
}

function switchCategory(catId) {
  activeCategory = catId;
  renderCategoryTabs();
  renderBlocks();
}

function renderBlocks() {
  const cat = CATEGORIES.find(c => c.id === activeCategory);
  const el = document.getElementById('blocksList');
  if (!cat) return;
  el.innerHTML = cat.blocks.map(b => `
    <div class="block-item" style="--accent:${cat.color}" onclick="addBlock('${cat.id}','${b.id}')">
      <div class="title">${b.title}</div>
      <div class="desc">${b.content || '(无内容)'}</div>
      <div class="tags">${b.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function findBlock(blockId) {
  for (const cat of CATEGORIES) {
    const b = cat.blocks.find(b => b.id === blockId);
    if (b) return { block: b, category: cat };
  }
  return null;
}

function addBlock(catId, blockId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return;
  const block = cat.blocks.find(b => b.id === blockId);
  if (!block) return;
  assembled.push({ blockId, categoryId: catId, block });
  renderAssembly();
  renderPrompt();
}

function removeBlock(index) {
  assembled.splice(index, 1);
  renderAssembly();
  renderPrompt();
}

function moveBlock(index, dir) {
  const ni = index + dir;
  if (ni < 0 || ni >= assembled.length) return;
  [assembled[index], assembled[ni]] = [assembled[ni], assembled[index]];
  renderAssembly();
  renderPrompt();
}

function clearAssembly() {
  assembled = [];
  renderAssembly();
  renderPrompt();
}

function resetAll() {
  clearAssembly();
  document.getElementById('promptPreview').className = 'prompt-preview empty';
  document.getElementById('promptPreview').textContent = '从左侧选择积木，你的Prompt会在这里实时生成...';
  document.getElementById('copyBtn').disabled = true;
}

function loadPreset(presetId) {
  const preset = PRESETS.find(p => p.id === presetId);
  if (!preset) return;
  assembled = [];
  for (const blockId of preset.blocks) {
    const found = findBlock(blockId);
    if (found) assembled.push({ blockId, categoryId: found.category.id, block: found.block });
  }
  renderAssembly();
  renderPrompt();
}

function renderAssembly() {
  const el = document.getElementById('assemblyArea');
  const countEl = document.getElementById('assemblyCount');
  countEl.textContent = `${assembled.length} 个积木`;
  if (assembled.length === 0) {
    el.innerHTML = `<div class="assembly-empty"><div class="icon">🧱</div><div class="text">从左侧选择积木开始拼装</div><div class="hint">或点击顶部预设模板一键加载</div></div>`;
    return;
  }
  el.innerHTML = assembled.map((item, i) => {
    const cat = CATEGORIES.find(c => c.id === item.categoryId);
    const color = cat ? cat.color : '#6366f1';
    const icon = cat ? cat.icon : '🔧';
    return `
      <div class="assembled-block" style="--accent:${color}">
        <div class="order" style="background:${color}">${i + 1}</div>
        <div class="body">
          <div class="label">${icon} ${cat ? cat.name : ''} - ${item.block.title}</div>
          <div class="content">${item.block.content || '(无内容，仅作占位)'}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <button class="move-btn${i === 0 ? ' disabled' : ''}" onclick="moveBlock(${i},-1)" title="上移">▲</button>
          <button class="move-btn${i === assembled.length - 1 ? ' disabled' : ''}" onclick="moveBlock(${i},1)" title="下移">▼</button>
          <button class="remove-btn" onclick="removeBlock(${i})" title="删除">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderPrompt() {
  const el = document.getElementById('promptPreview');
  const copyBtn = document.getElementById('copyBtn');
  if (assembled.length === 0) {
    el.className = 'prompt-preview empty';
    el.textContent = '从左侧选择积木，你的Prompt会在这里实时生成...';
    copyBtn.disabled = true;
    return;
  }
  const parts = assembled.map(item => item.block.content).filter(c => c && c.trim());
  if (parts.length === 0) {
    el.className = 'prompt-preview empty';
    el.textContent = '当前所有积木内容为空，请添加有内容的积木...';
    copyBtn.disabled = true;
    return;
  }
  const prompt = parts.join('\n\n');
  el.className = 'prompt-preview';
  el.textContent = prompt;
  copyBtn.disabled = !prompt;
}

function copyPrompt() {
  const text = document.getElementById('promptPreview').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板！');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制到剪贴板！'); } catch(e) { showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
