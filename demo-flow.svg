<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#243040"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Step 1: Choose Blocks -->
  <rect x="20" y="40" width="150" height="120" fill="#2a2d3e" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="95" y="75" font-family="Arial" font-size="20" fill="#c4b5fd" text-anchor="middle">🎭 🎯 📋</text>
  <text x="95" y="100" font-family="Arial" font-size="12" fill="#e2e8f0" text-anchor="middle">选择积木</text>
  <text x="95" y="118" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">8 大分类</text>
  <text x="95" y="135" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">72+ 模块</text>
  
  <!-- Arrow 1 -->
  <path d="M 180 100 L 210 100" stroke="url(#arrow)" stroke-width="3" fill="none"/>
  <polygon points="210,95 220,100 210,105" fill="#8b5cf6"/>
  
  <!-- Step 2: Assemble -->
  <rect x="230" y="40" width="150" height="120" fill="#2a2d3e" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="305" y="75" font-family="Arial" font-size="20" fill="#a5b4fc" text-anchor="middle">🧱 🧱 🧱</text>
  <text x="305" y="100" font-family="Arial" font-size="12" fill="#e2e8f0" text-anchor="middle">拼装积木</text>
  <text x="305" y="118" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">拖拽排序</text>
  <text x="305" y="135" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">冲突检测</text>
  
  <!-- Arrow 2 -->
  <path d="M 390 100 L 420 100" stroke="url(#arrow)" stroke-width="3" fill="none"/>
  <polygon points="420,95 430,100 420,105" fill="#8b5cf6"/>
  
  <!-- Step 3: Generate -->
  <rect x="440" y="40" width="150" height="120" fill="#2a2d3e" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="515" y="75" font-family="Arial" font-size="20" fill="#6ee7b7" text-anchor="middle">📄 ✨</text>
  <text x="515" y="100" font-family="Arial" font-size="12" fill="#e2e8f0" text-anchor="middle">生成 Prompt</text>
  <text x="515" y="118" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">实时预览</text>
  <text x="515" y="135" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">一键复制</text>
  
  <!-- Arrow 3 -->
  <path d="M 600 100 L 630 100" stroke="url(#arrow)" stroke-width="3" fill="none"/>
  <polygon points="630,95 640,100 630,105" fill="#8b5cf6"/>
  
  <!-- Step 4: Use -->
  <rect x="650" y="40" width="150" height="120" fill="#2a2d3e" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="725" y="75" font-family="Arial" font-size="20" fill="#fcd34d" text-anchor="middle">🚀</text>
  <text x="725" y="100" font-family="Arial" font-size="12" fill="#e2e8f0" text-anchor="middle">粘贴使用</text>
  <text x="725" y="118" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">ChatGPT</text>
  <text x="725" y="135" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">Claude / Gemini</text>
  
  <!-- Title -->
  <text x="400" y="25" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" opacity="0.7">PromptBlocks 使用流程</text>
</svg>
