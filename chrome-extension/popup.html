<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 380px; min-height: 400px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e8; }
.header { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 14px 16px; }
.header h1 { font-size: 16px; color: #fff; }
.header p { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 2px; }
.content { padding: 12px; }
.search-box { width: 100%; padding: 8px 12px; border: 1px solid #2a2a3e; border-radius: 6px; background: #1a1a2e; color: #e0e0e8; font-size: 13px; margin-bottom: 10px; }
.category-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.cat-tab { padding: 4px 8px; border: 1px solid #2a2a3e; border-radius: 4px; background: transparent; color: #8888a0; font-size: 11px; cursor: pointer; }
.cat-tab.active { background: #6366f1; color: #fff; border-color: #6366f1; }
.block-list { max-height: 280px; overflow-y: auto; }
.block-item { padding: 8px 10px; border: 1px solid #2a2a3e; border-radius: 6px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s; }
.block-item:hover { border-color: #6366f1; background: rgba(99,102,241,0.08); }
.block-item .block-title { font-size: 12px; color: #e0e0e8; font-weight: 600; }
.block-item .block-cat { font-size: 10px; color: #8888a0; margin-top: 2px; }
.assembled-area { margin-top: 10px; padding: 8px; border: 1px dashed #2a2a3e; border-radius: 6px; min-height: 40px; }
.assembled-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: rgba(99,102,241,0.15); border: 1px solid #6366f1; border-radius: 4px; font-size: 11px; color: #c4b5fd; margin: 2px; }
.assembled-chip .remove { cursor: pointer; opacity: 0.6; }
.assembled-chip .remove:hover { opacity: 1; }
.actions { display: flex; gap: 6px; margin-top: 10px; }
.btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
.btn-secondary { background: #2a2a3e; color: #e0e0e8; border: 1px solid #2a2a3e; }
.preview { margin-top: 8px; padding: 8px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px; font-size: 11px; color: #8888a0; max-height: 100px; overflow-y: auto; white-space: pre-wrap; }
.stat { font-size: 11px; color: #8888a0; margin-bottom: 8px; }
.stat span { color: #6366f1; font-weight: 600; }
</style>
</head>
<body>
<div class="header">
  <h1>🧱 PromptBlocks</h1>
  <p>72+积木 · 选积木拼Prompt · 一键插入</p>
</div>
<div class="content">
  <div class="stat">积木总数: <span id="blockCount">72</span> | 已选: <span id="selectedCount">0</span></div>
  <input class="search-box" id="searchInput" placeholder="搜索积木..." />
  <div class="category-tabs" id="catTabs"></div>
  <div class="block-list" id="blockList"></div>
  <div class="assembled-area" id="assembledArea">
    <span style="font-size:11px;color:#8888a0">从上方选择积木添加到拼装区</span>
  </div>
  <div class="preview" id="preview"></div>
  <div class="actions">
    <button class="btn btn-primary" id="insertBtn" onclick="insertToPage()">插入到页面</button>
    <button class="btn btn-primary" id="copyBtn" onclick="copyPrompt()">复制</button>
    <button class="btn btn-secondary" onclick="clearAll()">清空</button>
  </div>
</div>
<script src="blocks-data.js"></script>
<script src="popup.js"></script>
</body>
</html>
